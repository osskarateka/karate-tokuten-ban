<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>空手 得点板</title>

<!-- ホーム画面に追加してアプリのように使うための設定(PWA) -->
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="得点板">
<meta name="theme-color" content="#000000">
<style>
  :root {
    --bg: #000000;
    --aka: #e6394a;
    --aka-dim: #7a1522;
    --ao: #3a5bdc;
    --ao-dim: #16204d;
    --yellow: #f2d43a;
    --orange: #ff9a2e;
    --panel-line-aka: #e6394a;
    --panel-line-ao: #3a5bdc;
    --text-white: #f2f2f2;
    --gray: #3a3a3a;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #000000; }
  }
  :root[data-theme="dark"] { --bg: #000000; }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg);
    font-family: 'Hiragino Sans', 'Yu Gothic', 'Segoe UI', system-ui, sans-serif;
    overflow: hidden;
    color: var(--text-white);
  }
  .app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    width: 100vw;
  }

  /* 上下を逆さまにして見ても同じ構造に見えるよう、画面を上下対称に組んでいる:
     上の帯と下の帯に同じ情報(一本/技あり/有効/先取/カテゴリー)を置き、下の帯は180度回転した向きで表示。
     真ん中は左右に得点、中央にタイマー。どちら向きから見ても、文字が正立している帯が1本ある。 */
  .strip {
    display: flex; flex: 0 0 auto;
    height: clamp(78px, 20vh, 170px); min-height: 0;
  }
  .app.layout-reversed .strip,
  .app.layout-reversed .board { flex-direction: row-reverse; }
  .grp {
    flex: 1; display: flex; min-width: 0; min-height: 0;
    border: 2px solid var(--panel-line-aka);
  }
  .grp.ao { border-color: var(--panel-line-ao); }
  .grp.aka { background: linear-gradient(180deg, rgba(230,57,74,0.14), rgba(230,57,74,0.04)); }
  .grp.ao  { background: linear-gradient(180deg, rgba(58,91,220,0.14), rgba(58,91,220,0.04)); }
  .strip-bottom .grp { transform: rotate(180deg); }

  .cell {
    flex: 1 1 0; min-width: 0; min-height: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    position: relative; overflow: hidden; cursor: pointer; padding: 2px;
    border-right: 1px solid var(--panel-line-aka);
  }
  .grp.ao .cell { border-right-color: var(--panel-line-ao); }
  .cell:last-child { border-right: none; }
  .cell.pen { flex: 1.6 1 0; }
  .cell-label { font-size: clamp(11px, 1.9vw, 20px); color: #ddd; line-height: 1.1; white-space: nowrap; }
  .cell-num { font-size: 60px; font-weight: 800; color: var(--text-white); line-height: 1; white-space: nowrap; }
  .cell-minus {
    position: absolute; right: 2px; bottom: 2px;
    background: #1a1a1a; color: #999; border: 1px solid #444;
    border-radius: 4px; width: 20px; height: 20px; font-size: 13px;
    display: flex; align-items: center; justify-content: center;
  }
  .cell.pen .cell-label { color: var(--yellow); }
  .pen-text { font-size: 30px; font-weight: 800; color: #555; line-height: 1.05; text-align: center; white-space: nowrap; }
  .pen-text.p1 { color: var(--yellow); }
  .pen-text.p2 { color: var(--orange); text-shadow: 0 0 10px rgba(255,154,46,0.6); }
  .pen-text.p3 { color: var(--aka); text-shadow: 0 0 12px rgba(230,57,74,0.7); }
  .pen-text.p4 { color: #ff2020; text-shadow: 0 0 14px rgba(255,32,32,0.8); }
  .pen-text.p5 { color: #ff2020; text-shadow: 0 0 18px rgba(255,32,32,1); animation: blink 0.8s infinite; }
  @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
  .senshu-mark {
    width: clamp(18px, 3.6vw, 34px); height: clamp(18px, 3.6vw, 34px);
    border-radius: 50%; background: #2a2a2a; border: 2px solid #444; transition: all 0.25s;
  }
  .cell.senshu.lit-aka .senshu-mark { background: var(--aka); border-color: #ff8a95; box-shadow: 0 0 14px var(--aka); }
  .cell.senshu.lit-ao .senshu-mark { background: var(--ao); border-color: #8aa0ff; box-shadow: 0 0 14px var(--ao); }

  /* 真ん中: 左右に得点、中央にタイマー(どちらも中央寄せなので上下逆でも位置が変わらない) */
  .board { display: flex; flex: 1 1 auto; min-height: 0; }
  .side {
    flex: 1; display: flex; min-width: 0; min-height: 0; position: relative;
    border: 2px solid var(--panel-line-aka);
    transition: box-shadow 0.3s, opacity 0.3s;
  }
  .side.ao { border-color: var(--panel-line-ao); }
  .side.aka { background: linear-gradient(180deg, rgba(230,57,74,0.12), rgba(230,57,74,0.03)); }
  .side.ao  { background: linear-gradient(180deg, rgba(58,91,220,0.12), rgba(58,91,220,0.03)); }
  .side.winner { box-shadow: inset 0 0 40px 6px rgba(255,255,255,0.25); }
  .side.loser { opacity: 0.55; }
  .main-score-area {
    flex: 1; display: flex; align-items: center; justify-content: center;
    cursor: pointer; overflow: hidden; min-width: 0; min-height: 0;
  }
  .total-score {
    font-size: 200px; font-weight: 800; line-height: 1;
    color: var(--aka); text-shadow: 0 0 18px rgba(230,57,74,0.55);
    font-variant-numeric: tabular-nums; letter-spacing: -2px; white-space: nowrap;
  }
  .side.ao .total-score { color: var(--ao); text-shadow: 0 0 18px rgba(58,91,220,0.6); }

  .timer-col {
    flex: 0 0 30%; display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-width: 0; min-height: 0; overflow: hidden; border-top: 1px solid #222; border-bottom: 1px solid #222;
  }
  .timer-display {
    font-size: 90px; font-weight: 800; color: var(--aka);
    text-shadow: 0 0 16px rgba(230,57,74,0.5);
    font-variant-numeric: tabular-nums; letter-spacing: -1px; cursor: pointer; white-space: nowrap;
  }
  .timer-display.running { color: #3ddc5a; text-shadow: 0 0 16px rgba(61,220,90,0.5); }
  .timer-display.timeup { animation: blink 0.6s infinite; color: #ff2020; }
  /* 残り時間バー: 数字が逆さまでも残量が直感的に分かる(左右対称な見た目) */
  .timer-bar-track {
    width: 80%; height: clamp(8px, 1.6vh, 14px); background: #1a1a1a; border: 1px solid #333;
    border-radius: 7px; margin-top: clamp(8px, 1.6vh, 16px); overflow: hidden; flex: 0 0 auto;
  }
  .timer-bar-fill { height: 100%; width: 100%; background: #3ddc5a; transition: width 1s linear, background-color 0.3s; }
  .timer-bar-fill.low { background: #ff2020; }

  .footer-bar {
    flex: 0 0 auto;
    display: flex;
    align-items: stretch;
    justify-content: center;
    gap: 2vw;
    padding: 10px 12px;
    background: #0a0a0a;
    border-top: 1px solid #222;
  }
  .footer-bar button {
    flex: 1;
    max-width: 220px;
    background: #1a1a1a; color: #ddd; border: 1px solid #444;
    border-radius: 10px; padding: clamp(10px, 2.2vh, 20px) 10px;
    font-size: clamp(14px, 2.6vw, 24px); font-weight: 700; cursor: pointer;
  }
  .footer-bar button:active { background: #2a2a2a; }
  .footer-bar #reset-all-btn { color: #ff8a8a; border-color: #7a1522; }
  .footer-bar #undo-btn { color: #ffd27a; border-color: #6b5420; }

  /* 右下の小さなクレジット表示(操作の邪魔にならないようクリックは透過) */
  .credit {
    position: fixed; right: 6px; bottom: 2px;
    font-size: 10px; color: rgba(255,255,255,0.22);
    pointer-events: none; user-select: none; z-index: 5;
  }

  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.75);
    display: none; align-items: center; justify-content: center; z-index: 10;
  }
  .overlay.show { display: flex; }
  .panel {
    background: #141414; border: 1px solid #333; border-radius: 12px;
    padding: 20px; width: min(340px, 90vw);
  }
  .panel h3 { margin: 0 0 14px; font-size: 16px; color: #eee; text-align: center; }
  .panel h4 { margin: 0 0 10px; font-size: 13px; color: #999; font-weight: 600; }
  .panel .row { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 14px; }
  .panel input {
    width: 64px; font-size: 22px; text-align: center; background: #000;
    color: #fff; border: 1px solid #444; border-radius: 6px; padding: 6px;
  }
  .panel .row span { font-size: 20px; color: #ccc; }
  .panel-buttons { display: flex; gap: 10px; margin-top: 10px; }
  .panel-buttons button {
    flex: 1; padding: 10px; border-radius: 8px; border: none; font-size: 15px; cursor: pointer;
  }
  .btn-primary { background: #2b6fe0; color: #fff; }
  .btn-secondary { background: #333; color: #ddd; }
  .btn-danger { background: #7a1522; color: #fff; }

  .quick-presets { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-bottom: 14px; }
  .quick-presets button {
    background: #1e1e1e; border: 1px solid #333; color: #ccc; border-radius: 6px;
    padding: 6px 10px; font-size: 13px; cursor: pointer;
  }

  /* 試合終了時の勝敗表示(色旗イラスト+中央テキスト) */
  .result-overlay { z-index: 20; background: rgba(0,0,0,0.92); }
  .result-content {
    display: flex; flex-direction: column; align-items: center;
    gap: clamp(10px, 2.5vh, 24px); padding: 20px; width: min(640px, 94vw);
  }
  .result-flags {
    display: flex; align-items: center; justify-content: center;
    width: 100%; min-height: clamp(140px, 26vh, 260px);
  }
  .flag-svg {
    width: clamp(130px, 24vw, 230px); height: auto;
    transform-origin: 16% 94%;
    filter: drop-shadow(0 4px 10px rgba(0,0,0,0.5));
  }
  .result-text {
    font-size: clamp(30px, 6.5vw, 76px); font-weight: 800; color: #fff;
    text-align: center; line-height: 1.2; white-space: nowrap;
  }
  #result-close { padding: 12px 28px; border-radius: 8px; border: none; font-size: 16px; cursor: pointer; }

  /* 勝利表示: 勝った方の旗だけを中央に表示し、揺れるアニメーションを付ける */
  .result-overlay.win-aka .flag-ao,
  .result-overlay.win-ao .flag-aka { display: none; }
  .result-overlay.win-aka .flag-aka,
  .result-overlay.win-ao .flag-ao { animation: flagwave 1.6s ease-in-out infinite; }
  .result-overlay.win-aka .result-text { color: var(--aka); }
  .result-overlay.win-ao .result-text { color: var(--ao); }

  /* 引き分け(判定): 赤旗・青旗をクロスさせて表示 */
  .result-overlay.draw .flag-aka { transform: rotate(-32deg); margin-right: -12%; }
  .result-overlay.draw .flag-ao { transform: rotate(32deg) scaleX(-1); margin-left: -12%; }
  .result-overlay.draw .result-text { color: var(--yellow); font-size: clamp(22px, 5vw, 56px); }

  @keyframes flagwave {
    0%, 100% { transform: rotate(-6deg); }
    50% { transform: rotate(6deg); }
  }

  @media (max-width: 700px) {
    .strip { height: clamp(96px, 24vh, 200px); }
    .grp { flex-wrap: wrap; }
    .cell { flex: 1 1 30%; border-bottom: 1px solid var(--panel-line-aka); }
    .grp.ao .cell { border-bottom-color: var(--panel-line-ao); }
    .cell.pen { flex: 1 1 60%; }
    .timer-col { flex-basis: 34%; }
  }

  /* ボタンが5つになったので、1行に収まりきらない幅ではラップさせる */
  @media (max-width: 900px) {
    .footer-bar { flex-wrap: wrap; gap: 8px; }
    .footer-bar button { flex: 1 1 28%; max-width: none; }
  }

  .toggle-row {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    background: #1b1b1b; border: 1px solid #333; border-radius: 8px;
    padding: 10px 12px; margin-bottom: 14px; text-align: left;
  }
  .toggle-row .toggle-label { font-size: 14px; color: #ddd; }
  .toggle-row .toggle-desc { font-size: 11px; color: #888; margin-top: 2px; }
  .toggle-switch-btn {
    flex: 0 0 auto; min-width: 64px; padding: 8px 14px; border-radius: 20px;
    border: 1px solid #444; background: #2a2a2a; color: #ccc; font-size: 13px; cursor: pointer;
  }
  .toggle-switch-btn.on { background: #2b6fe0; color: #fff; border-color: #2b6fe0; }

</style>
</head>
<body>
<div class="app" id="app">
  <div class="strip strip-top" id="strip-top"></div>

  <div class="board">
    <div class="side aka" id="side-aka">
      <div class="main-score-area" id="aka-score-area"><div class="total-score" id="aka-total">0</div></div>
    </div>
    <div class="timer-col">
      <div class="timer-display" id="timer-display">1:30</div>
      <div class="timer-bar-track"><div class="timer-bar-fill" id="timer-bar-fill"></div></div>
    </div>
    <div class="side ao" id="side-ao">
      <div class="main-score-area" id="ao-score-area"><div class="total-score" id="ao-total">0</div></div>
    </div>
  </div>

  <div class="strip strip-bottom" id="strip-bottom"></div>

  <div class="footer-bar">
    <button id="timer-minus1">−1秒</button>
    <button id="settings-btn">設定</button>
    <button id="timer-plus1">+1秒</button>
    <button id="undo-btn">一つ前に戻す</button>
    <button id="reset-all-btn">試合をリセット</button>
  </div>

  <div class="credit" aria-hidden="true">©yamane1229</div>
</div>

<div class="overlay" id="settings-overlay">
  <div class="panel">
    <h3>設定</h3>
    <h4>タイマー時間</h4>
    <div class="quick-presets">
      <button data-sec="60">1:00</button>
      <button data-sec="90">1:30</button>
      <button data-sec="120">2:00</button>
      <button data-sec="180">3:00</button>
    </div>
    <div class="row">
      <input type="number" id="set-min" min="0" max="59" value="1">
      <span>分</span>
      <input type="number" id="set-sec" min="0" max="59" value="30">
      <span>秒</span>
    </div>

    <h4>画面の入れ替え</h4>
    <div class="toggle-row">
      <div>
        <div class="toggle-label">赤(アカ)・青(アオ)の表示を入れ替え</div>
      </div>
      <button class="toggle-switch-btn" id="toggle-swap-colors">OFF</button>
    </div>

    <div class="panel-buttons">
      <button class="btn-secondary" id="settings-cancel">キャンセル</button>
      <button class="btn-primary" id="settings-apply">セット</button>
    </div>
  </div>
</div>

<div class="overlay" id="confirm-overlay">
  <div class="panel">
    <h3>試合をリセットしますか？</h3>
    <div class="panel-buttons">
      <button class="btn-secondary" id="confirm-cancel">キャンセル</button>
      <button class="btn-danger" id="confirm-ok">リセットする</button>
    </div>
  </div>
</div>

<div class="overlay result-overlay" id="result-overlay">
  <div class="result-content">
    <div class="result-flags">
      <svg class="flag-svg flag-aka" viewBox="0 0 120 100" aria-hidden="true">
        <rect x="10" y="4" width="9" height="92" rx="3" fill="#1a1a1a"/>
        <path d="M19,9 C50,-2 72,20 101,9 C95,25 95,41 101,57 C72,46 50,68 19,57 Z" fill="var(--aka)"/>
      </svg>
      <svg class="flag-svg flag-ao" viewBox="0 0 120 100" aria-hidden="true">
        <rect x="10" y="4" width="9" height="92" rx="3" fill="#1a1a1a"/>
        <path d="M19,9 C50,-2 72,20 101,9 C95,25 95,41 101,57 C72,46 50,68 19,57 Z" fill="var(--ao)"/>
      </svg>
    </div>
    <div class="result-text" id="result-text">赤の勝利</div>
    <button class="btn-secondary" id="result-close">閉じる</button>
  </div>
</div>

<script>
(function(){
  var POINTS = { ippon: 3, wazaari: 2, yuko: 1 };
  var PENALTY_LABELS = ['', '注意1', '注意2', '注意3', '反則注意', '反則'];
  var history = []; // 「一つ前に戻す」用の状態スナップショット(得点・カテゴリー・先取のみ)
  var HISTORY_LIMIT = 30;

  var state = {
    aka: { ippon:0, wazaari:0, yuko:0, penalty:0 },
    ao:  { ippon:0, wazaari:0, yuko:0, penalty:0 },
    senshu: null, // 'aka' | 'ao' | null
    timer: { duration: 90, remaining: 90, running: false, intervalId: null },
    // 画面の入れ替え(赤青の表示位置)
    display: { swapColors: false },
    resultShown: false // 試合終了時の勝敗表示を出しているか
  };

  function loadSettings(){
    try {
      var raw = localStorage.getItem('karate-tokuten-settings');
      if (raw) {
        var s = JSON.parse(raw);
        if (s && typeof s.duration === 'number' && s.duration > 0) {
          state.timer.duration = s.duration;
          state.timer.remaining = s.duration;
        }
        if (s) {
          state.display.swapColors = !!s.swapColors;
        }
      }
    } catch(e) {}
  }
  function saveSettings(){
    try {
      localStorage.setItem('karate-tokuten-settings', JSON.stringify({
        duration: state.timer.duration,
        swapColors: state.display.swapColors
      }));
    } catch(e) {}
  }

  function applyDisplayLayout(){
    document.getElementById('app').classList.toggle('layout-reversed', !!state.display.swapColors);
  }

  function total(side){
    var s = state[side];
    return s.ippon*POINTS.ippon + s.wazaari*POINTS.wazaari + s.yuko*POINTS.yuko;
  }

  // shrink/grow el's font-size by binary search until it fills (availW x availH) as much as possible
  function fitTextElement(el, availW, availH, minFont, maxFont){
    if (availW <= 0 || availH <= 0) return;
    minFont = minFont || 10;
    maxFont = maxFont || 500;
    var lo = minFont, hi = maxFont, best = minFont;
    for (var i = 0; i < 18; i++){
      var mid = (lo + hi) / 2;
      el.style.fontSize = mid + 'px';
      var w = el.scrollWidth, h = el.scrollHeight;
      if (w <= availW && h <= availH) { best = mid; lo = mid; } else { hi = mid; }
    }
    el.style.fontSize = best + 'px';
  }

  // the content-box area available inside el (clientWidth/Height minus its own CSS padding),
  // so fitted text never overlaps padding reserved for labels/buttons
  function contentBoxSize(el, extraW, extraH){
    var cs = getComputedStyle(el);
    var padL = parseFloat(cs.paddingLeft) || 0, padR = parseFloat(cs.paddingRight) || 0;
    var padT = parseFloat(cs.paddingTop) || 0, padB = parseFloat(cs.paddingBottom) || 0;
    return {
      w: el.clientWidth - padL - padR - (extraW || 0),
      h: el.clientHeight - padT - padB - (extraH || 0)
    };
  }

  function fitAllText(){
    // 上下の帯: 一本/技あり/有効の数字
    document.querySelectorAll('.cell.cat').forEach(function(cell){
      var label = cell.querySelector('.cell-label');
      var num = cell.querySelector('.cell-num');
      fitTextElement(num, cell.clientWidth - 10, cell.clientHeight - label.offsetHeight - 10, 12, 200);
    });
    // 上下の帯: カテゴリー(注意/反則) — 折り返しあり
    document.querySelectorAll('.cell.pen').forEach(function(cell){
      var label = cell.querySelector('.cell-label');
      var t = cell.querySelector('.pen-text');
      fitTextElement(t, cell.clientWidth - 16, cell.clientHeight - label.offsetHeight - 10, 8, 80);
    });
    // 得点合計
    document.querySelectorAll('.main-score-area').forEach(function(area){
      var num = area.querySelector('.total-score');
      fitTextElement(num, area.clientWidth - 16, area.clientHeight - 8, 50, 600);
    });
    // タイマー — 下の残り時間バー分の高さを差し引いてからフィット
    var col = document.querySelector('.timer-col');
    var timerDisp = document.getElementById('timer-display');
    var barTrack = document.querySelector('.timer-bar-track');
    if (col && timerDisp) {
      var barH = barTrack ? (barTrack.offsetHeight + (parseFloat(getComputedStyle(barTrack).marginTop) || 0)) : 0;
      fitTextElement(timerDisp, col.clientWidth - 16, col.clientHeight - barH - 8, 30, 400);
    }
  }

  function render(){
    ['aka','ao'].forEach(function(side){
      var s = state[side];
      ['ippon','wazaari','yuko'].forEach(function(cat){
        document.querySelectorAll('.cell.cat[data-side="'+side+'"][data-cat="'+cat+'"] .cell-num').forEach(function(el){
          el.textContent = s[cat];
        });
      });
      document.getElementById(side+'-total').textContent = total(side);
      document.querySelectorAll('.cell.pen[data-side="'+side+'"] .pen-text').forEach(function(el){
        el.textContent = PENALTY_LABELS[s.penalty] || '';
        el.className = 'pen-text' + (s.penalty > 0 ? ' p'+s.penalty : '');
      });
      document.querySelectorAll('.cell.senshu[data-side="'+side+'"]').forEach(function(el){
        el.classList.toggle('lit-'+side, state.senshu === side);
      });
    });

    // timer
    var t = state.timer.remaining;
    var m = Math.floor(t/60);
    var sec = t%60;
    var disp = document.getElementById('timer-display');
    disp.textContent = m + ':' + (sec<10?'0':'') + sec;
    disp.classList.toggle('timeup', t<=0);
    disp.classList.toggle('running', state.timer.running);

    // 残り時間バー: 数字が読みにくい向きでも残量が一目で分かるように
    var barFill = document.getElementById('timer-bar-fill');
    var pct = state.timer.duration > 0 ? Math.max(0, Math.min(1, t / state.timer.duration)) : 0;
    barFill.style.width = (pct * 100) + '%';
    barFill.classList.toggle('low', t <= 15);

    // winner highlight only when timer at 0 and not running
    var aEl = document.getElementById('side-aka');
    var oEl = document.getElementById('side-ao');
    aEl.classList.remove('winner','loser');
    oEl.classList.remove('winner','loser');
    var matchEnded = !state.timer.running && state.timer.remaining <= 0 && state.timer.duration > 0;
    if (matchEnded) {
      var result = decideResult();
      if (result.type === 'win' && result.side === 'aka') { aEl.classList.add('winner'); oEl.classList.add('loser'); }
      else if (result.type === 'win' && result.side === 'ao') { oEl.classList.add('winner'); aEl.classList.add('loser'); }
      // 引き分けの場合はどちらも通常表示のまま(dimmedにしない)
    }
    renderResultOverlay(matchEnded);

    fitAllText();
  }

  // 勝敗判定: ①得点の高い方 → ②得点同点なら先取 → ③先取なしなら一本の数 →
  // ④一本も同数なら技ありの数 → ⑤それでも同じなら引き分け
  function decideResult(){
    var ta = total('aka'), to = total('ao');
    if (ta > to) return { type: 'win', side: 'aka' };
    if (to > ta) return { type: 'win', side: 'ao' };
    if (state.senshu === 'aka') return { type: 'win', side: 'aka' };
    if (state.senshu === 'ao') return { type: 'win', side: 'ao' };
    if (state.aka.ippon > state.ao.ippon) return { type: 'win', side: 'aka' };
    if (state.ao.ippon > state.aka.ippon) return { type: 'win', side: 'ao' };
    if (state.aka.wazaari > state.ao.wazaari) return { type: 'win', side: 'aka' };
    if (state.ao.wazaari > state.aka.wazaari) return { type: 'win', side: 'ao' };
    return { type: 'draw' };
  }

  // 試合終了時の勝敗表示(色旗+中央テキスト)の表示/非表示を更新
  function renderResultOverlay(matchEnded){
    var overlay = document.getElementById('result-overlay');
    if (!matchEnded || !state.resultShown) {
      overlay.classList.remove('show');
      return;
    }
    var result = decideResult();
    var textEl = document.getElementById('result-text');
    overlay.classList.remove('win-aka', 'win-ao', 'draw');
    if (result.type === 'draw') {
      overlay.classList.add('draw');
      textEl.textContent = '引き分け(判定)';
    } else if (result.side === 'aka') {
      overlay.classList.add('win-aka');
      textEl.textContent = '赤の勝利';
    } else {
      overlay.classList.add('win-ao');
      textEl.textContent = '青の勝利';
    }
    overlay.classList.add('show');
  }

  function maybeAwardSenshu(side){
    if (state.senshu === null) {
      var otherSide = side === 'aka' ? 'ao' : 'aka';
      if (total(side) > 0 && total(otherSide) === 0) {
        state.senshu = side;
      }
    }
  }

  // 得点・カテゴリー・先取を変更する直前の状態を保存しておく(「一つ前に戻す」用)
  function pushHistory(){
    history.push(JSON.stringify({ aka: state.aka, ao: state.ao, senshu: state.senshu }));
    if (history.length > HISTORY_LIMIT) history.shift();
  }
  function undoLast(){
    if (history.length === 0) return;
    var snap = JSON.parse(history.pop());
    state.aka = snap.aka;
    state.ao = snap.ao;
    state.senshu = snap.senshu;
    render();
  }

  function incCat(side, cat){
    pushHistory();
    state[side][cat]++;
    maybeAwardSenshu(side);
    render();
  }
  function decCat(side, cat){
    pushHistory();
    if (state[side][cat] > 0) state[side][cat]--;
    // re-evaluate senshu if both back to 0
    if (total('aka') === 0 && total('ao') === 0) state.senshu = null;
    render();
  }

  function cyclePenalty(side){
    pushHistory();
    state[side].penalty = (state[side].penalty + 1) % PENALTY_LABELS.length;
    render();
  }
  function decPenalty(side){
    pushHistory();
    if (state[side].penalty > 0) state[side].penalty--;
    render();
  }

  function toggleSenshuManual(side){
    pushHistory();
    state.senshu = (state.senshu === side) ? null : side;
    render();
  }

  // 上下の帯(同じ内容の2本)を作る。下の帯は各グループが180度回転して表示される
  var CATS = [['ippon','一本'],['wazaari','技あり'],['yuko','有効']];
  function buildGroup(side){
    var h = '<div class="grp '+side+'">';
    CATS.forEach(function(c){
      h += '<div class="cell cat" data-side="'+side+'" data-cat="'+c[0]+'">' +
           '<div class="cell-label">'+c[1]+'</div><div class="cell-num">0</div><div class="cell-minus">−</div></div>';
    });
    h += '<div class="cell senshu" data-side="'+side+'"><div class="cell-label">先取</div><div class="senshu-mark"></div></div>';
    h += '<div class="cell pen" data-side="'+side+'"><div class="cell-label">カテゴリー</div><div class="pen-text"></div><div class="cell-minus">−</div></div>';
    return h + '</div>';
  }
  ['strip-top','strip-bottom'].forEach(function(id){
    var el = document.getElementById(id);
    el.innerHTML = buildGroup('aka') + buildGroup('ao');
    el.addEventListener('click', function(e){
      var cell = e.target.closest('.cell');
      if (!cell) return;
      var side = cell.dataset.side;
      var isMinus = !!e.target.closest('.cell-minus');
      playTapSound();
      if (cell.classList.contains('cat')) {
        if (isMinus) decCat(side, cell.dataset.cat); else incCat(side, cell.dataset.cat);
      } else if (cell.classList.contains('senshu')) {
        toggleSenshuManual(side);
      } else if (cell.classList.contains('pen')) {
        if (isMinus) decPenalty(side); else cyclePenalty(side);
      }
    });
  });

  // 得点の大きい数字をタップすると有効(1点)
  ['aka','ao'].forEach(function(side){
    document.getElementById(side+'-score-area').addEventListener('click', function(){
      playTapSound();
      incCat(side,'yuko');
    });
  });

  // timer
  var warnedAt15 = false;
  function tick(){
    if (state.timer.remaining > 0) {
      state.timer.remaining--;
      if (state.timer.remaining === 15 && !warnedAt15) {
        warnedAt15 = true;
        playBuzzer15();
      }
      if (state.timer.remaining <= 0) {
        stopTimer();
        playBuzzerEnd();
        state.resultShown = true; // 試合終了: 勝敗表示を自動で出す
      }
    }
    render();
  }
  function startTimer(){
    if (state.timer.running || state.timer.remaining <= 0) return;
    state.timer.running = true;
    state.resultShown = false; // タイマーを再開したら勝敗表示は消す
    state.timer.intervalId = setInterval(tick, 1000);
    render();
  }
  function stopTimer(){
    state.timer.running = false;
    if (state.timer.intervalId) { clearInterval(state.timer.intervalId); state.timer.intervalId = null; }
    render();
  }
  function adjustTime(delta){
    state.timer.remaining = Math.max(0, state.timer.remaining + delta);
    warnedAt15 = state.timer.remaining <= 15;
    if (state.timer.remaining <= 0) {
      if (state.timer.running) stopTimer();
      state.resultShown = true; // 手動で0にした場合も試合終了として勝敗表示を出す
    }
    render();
  }

  // pressing the displayed time itself starts/stops the timer
  document.getElementById('timer-display').addEventListener('click', function(){
    playTapSound();
    if (state.timer.running) stopTimer(); else startTimer();
  });
  document.getElementById('timer-minus1').addEventListener('click', function(){ playTapSound(); adjustTime(-1); });
  document.getElementById('timer-plus1').addEventListener('click', function(){ playTapSound(); adjustTime(1); });

  // 一つ前に戻す(直前の得点・カテゴリー・先取の操作を取り消す)
  document.getElementById('undo-btn').addEventListener('click', function(){
    playTapSound();
    undoLast();
  });

  // 勝敗表示を閉じる(ボタン or 背景タップ)
  var resultOverlay = document.getElementById('result-overlay');
  document.getElementById('result-close').addEventListener('click', function(){
    playTapSound();
    state.resultShown = false;
    render();
  });
  resultOverlay.addEventListener('click', function(e){
    if (e.target === resultOverlay) {
      state.resultShown = false;
      render();
    }
  });

  // --- sound effects ---
  var audioCtx = null;
  function getAudioCtx(){
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) { return null; }
    }
    if (audioCtx.state === 'suspended') { try { audioCtx.resume(); } catch(e) {} }
    return audioCtx;
  }

  // 操作音: 金属系の短いクリック音(タップ全般で再生)
  function playTapSound(){
    var ctx = getAudioCtx();
    if (!ctx) return;
    var now = ctx.currentTime;
    // 短いノイズバースト(アタック感)
    var bufLen = Math.floor(ctx.sampleRate * 0.04);
    var buffer = ctx.createBuffer(1, bufLen, ctx.sampleRate);
    var data = buffer.getChannelData(0);
    for (var i = 0; i < bufLen; i++){
      data[i] = (Math.random()*2-1) * Math.pow(1 - i/bufLen, 2.5);
    }
    var noise = ctx.createBufferSource();
    noise.buffer = buffer;
    var bandpass = ctx.createBiquadFilter();
    bandpass.type = 'bandpass';
    bandpass.frequency.value = 3400;
    bandpass.Q.value = 3;
    var noiseGain = ctx.createGain();
    noiseGain.gain.setValueAtTime(0.35, now);
    noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.045);
    noise.connect(bandpass); bandpass.connect(noiseGain); noiseGain.connect(ctx.destination);
    noise.start(now); noise.stop(now + 0.045);

    // 金属的な高音のピン(2音)で「カチッ」という質感を足す
    [2800, 4200].forEach(function(freq, idx){
      var o = ctx.createOscillator();
      var g = ctx.createGain();
      o.type = 'triangle';
      o.frequency.value = freq;
      g.gain.setValueAtTime(0.12/(idx+1), now);
      g.gain.exponentialRampToValueAtTime(0.0001, now + 0.07);
      o.connect(g); g.connect(ctx.destination);
      o.start(now); o.stop(now + 0.07);
    });
  }

  // 共通のブザー音(1本のトーン)を指定した開始時刻・長さで鳴らす
  function scheduleBuzzerTone(ctx, startTime, dur){
    var o = ctx.createOscillator();
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(220, startTime);
    var g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, startTime);
    g.gain.linearRampToValueAtTime(0.32, startTime + 0.03);
    g.gain.setValueAtTime(0.32, startTime + Math.max(0, dur - 0.08));
    g.gain.linearRampToValueAtTime(0.0001, startTime + dur);
    // トレモロでブザーらしい質感を出す
    var lfo = ctx.createOscillator();
    lfo.type = 'square';
    lfo.frequency.value = 48;
    var lfoGain = ctx.createGain();
    lfoGain.gain.value = 0.11;
    lfo.connect(lfoGain); lfoGain.connect(g.gain);
    o.connect(g); g.connect(ctx.destination);
    o.start(startTime); o.stop(startTime + dur);
    lfo.start(startTime); lfo.stop(startTime + dur);
  }

  // 試合終了15秒前の音: ブザー音(約1秒)
  function playBuzzer15(){
    var ctx = getAudioCtx();
    if (!ctx) return;
    scheduleBuzzerTone(ctx, ctx.currentTime, 1.0);
  }

  // 試合終了の音: 15秒前の音を2回繰り返す(約2秒)
  function playBuzzerEnd(){
    var ctx = getAudioCtx();
    if (!ctx) return;
    var now = ctx.currentTime;
    scheduleBuzzerTone(ctx, now, 0.95);
    scheduleBuzzerTone(ctx, now + 1.0, 0.95);
  }

  // 設定: ②画面の入れ替え/③２画面の反転 トグルボタンの表示を現在の状態に合わせる
  var swapColorsBtn = document.getElementById('toggle-swap-colors');
  function updateDisplayToggleButtons(){
    swapColorsBtn.textContent = state.display.swapColors ? 'ON' : 'OFF';
    swapColorsBtn.classList.toggle('on', state.display.swapColors);
  }
  swapColorsBtn.addEventListener('click', function(){
    playTapSound();
    state.display.swapColors = !state.display.swapColors;
    updateDisplayToggleButtons();
    applyDisplayLayout();
    saveSettings();
  });
  // settings overlay
  var settingsOverlay = document.getElementById('settings-overlay');
  document.getElementById('settings-btn').addEventListener('click', function(){
    playTapSound();
    document.getElementById('set-min').value = Math.floor(state.timer.duration/60);
    document.getElementById('set-sec').value = state.timer.duration%60;
    updateDisplayToggleButtons();
    settingsOverlay.classList.add('show');
  });
  document.getElementById('settings-cancel').addEventListener('click', function(){
    playTapSound();
    settingsOverlay.classList.remove('show');
  });
  document.querySelectorAll('.quick-presets button').forEach(function(btn){
    btn.addEventListener('click', function(){
      playTapSound();
      var sec = parseInt(btn.dataset.sec, 10);
      document.getElementById('set-min').value = Math.floor(sec/60);
      document.getElementById('set-sec').value = sec%60;
    });
  });
  document.getElementById('settings-apply').addEventListener('click', function(){
    playTapSound();
    var m = parseInt(document.getElementById('set-min').value, 10) || 0;
    var s = parseInt(document.getElementById('set-sec').value, 10) || 0;
    var total = Math.max(0, m*60 + s);
    stopTimer();
    state.timer.duration = total;
    state.timer.remaining = total;
    warnedAt15 = total <= 15;
    state.resultShown = false;
    saveSettings();
    settingsOverlay.classList.remove('show');
    render();
  });

  // reset all
  var confirmOverlay = document.getElementById('confirm-overlay');
  document.getElementById('reset-all-btn').addEventListener('click', function(){
    playTapSound();
    confirmOverlay.classList.add('show');
  });
  document.getElementById('confirm-cancel').addEventListener('click', function(){
    playTapSound();
    confirmOverlay.classList.remove('show');
  });
  document.getElementById('confirm-ok').addEventListener('click', function(){
    playTapSound();
    stopTimer();
    state.aka = { ippon:0, wazaari:0, yuko:0, penalty:0 };
    state.ao  = { ippon:0, wazaari:0, yuko:0, penalty:0 };
    state.senshu = null;
    state.timer.remaining = state.timer.duration;
    warnedAt15 = state.timer.duration <= 15;
    state.resultShown = false;
    history.length = 0;
    confirmOverlay.classList.remove('show');
    render();
  });

  var resizeTimer = null;
  window.addEventListener('resize', function(){
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(fitAllText, 100);
  });

  loadSettings();
  applyDisplayLayout();
  updateDisplayToggleButtons();
  render();

  // ホーム画面追加後もオフラインで起動できるようService Workerを登録
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').catch(function(){});
    });
  }
})();
</script>
</body>
</html>
